; STM32F746G-DISCO - Wi-Fi on an ESP-Hosted co-processor (a Waveshare
; ESP32-C3-Zero running coprocessor/'s firmware) on the Arduino header.
; The wires: README.md next to this file.
;
; Complete configuration: the pins, the dmspi bus and the Wi-Fi device. They
; share friends_group=wifi: dmspi takes its chip select from it
; (friend_role=chip_select), dmesphosted the bus and its three pins
; (spi_bus, handshake, data_ready, reset) - dmdevfs reports their nodes, no
; path is configured by hand. Do not load dmspi's own spi2.ini next to this
; file: it configures the same controller.
;
; Arduino pins (UM1907; mbed-os DISCO_F746NG PinNames.h):
;   D13 PI1  SPI2_SCK   - also the green LED LD1 (dmgpio's board ini makes it
;                         an output with driver_order 0; these come after it,
;                         so the pin is SPI's - the LED flickers with the clock)
;   D12 PB14 SPI2_MISO
;   D11 PB15 SPI2_MOSI
;   D5  PI0  CS (a GPIO: nss_mode=soft) - D5, not D10: D10 is PA8
;   D2  PG6  Handshake  (EXTI6)
;   D4  PG7  Data Ready (EXTI7)
;   D7  PI3  Reset      (open drain: the co-processor pulls it up)
; AF5 is SPI2's on PI1/PB14/PB15 (the dmspi configuration verified on this
; board). No other driver of this board uses EXTI lines 6 and 7.
;
; SPI mode 3, as the co-processor's firmware. SPI2's clock is APB1's 54 MHz
; divided by a power of two: 6.75 MHz asked for = 54/8 (a 1600-byte
; transaction takes ~2 ms). Not faster: on the ESP32-C3 only CLK and MOSI are
; on the SPI's own pins (IO MUX) - MISO and CS go through the GPIO matrix,
; which loses bits at 13.5 MHz (its slave stops answering). 4000000 gives
; 3.375 MHz for long wires.
;
; No network here - this file is published. Connect from the shell
; (wifi connect SSID PASSWORD), or give ssid= / password= in a copy of this
; file of your own (on the card).

[wifi_spi_sck]
driver_name=dmgpio
driver_order=20
friends_group=wifi
pin=PI1
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[wifi_spi_miso]
driver_name=dmgpio
driver_order=20
friends_group=wifi
pin=PB14
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=up

[wifi_spi_mosi]
driver_name=dmgpio
driver_order=20
friends_group=wifi
pin=PB15
mode=alternate
alternate_function=5
speed=maximum
output_circuit=push_pull
pull=none

[wifi_spi_cs]
driver_name=dmgpio
driver_order=20
friends_group=wifi
friend_role=chip_select
pin=PI0
mode=output
pull=up
speed=maximum
output_circuit=push_pull

; The co-processor's pins: high = ready / has data. Pulled down: a
; co-processor not there reads as not ready. Both edges: the driver keeps
; their levels from the interrupts and needs no node access to know them.
[wifi_handshake]
driver_name=dmgpio
driver_order=20
friends_group=wifi
friend_role=handshake
pin=PG6
mode=input
pull=down
interrupt_trigger=both_edges
interrupt_handler=wlan0.handshake

[wifi_data_ready]
driver_name=dmgpio
driver_order=20
friends_group=wifi
friend_role=data_ready
pin=PG7
mode=input
pull=down
interrupt_trigger=both_edges
interrupt_handler=wlan0.data_ready

[wifi_reset]
driver_name=dmgpio
driver_order=20
friends_group=wifi
friend_role=reset
pin=PI3
mode=output
speed=minimum
output_circuit=open_drain
pull=none

; The bus (dmspi's configuration keys are decimal)
[wifi_spi]
driver_name=dmspi
driver_order=21
friends_group=wifi
friend_role=spi_bus
instance=2
role=master
baudrate=6750000
mode=3
bit_order=msb_first
nss_mode=soft
cs_active_level=low

; The Wi-Fi: node /dev/wlan0, interface "wlan0"
[wlan0]
driver_name=dmesphosted
driver_order=22
friends_group=wifi
interface=wlan0
handshake_interrupt=wlan0.handshake
data_ready_interrupt=wlan0.data_ready
