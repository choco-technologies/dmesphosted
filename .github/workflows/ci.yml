name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmesphosted
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmesphosted.dmf
          test -f build/dmf/dmesphosted_version.txt
          test -f build/dmf/test_dmesphosted.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmesphosted-local.dmd -y
          dmod_loader build/dmf/test_dmesphosted.dmf

  coprocessor:
    name: Co-processor firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        board: [ esp32c3-zero ]
    container:
      image: espressif/idf:v5.5.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build it
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          coprocessor/build.sh ${{ matrix.board }}

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: dmesphosted-coprocessor-${{ matrix.board }}
          path: coprocessor/build/${{ matrix.board }}/dmesphosted-coprocessor-${{ matrix.board }}.bin
          retention-days: 14
